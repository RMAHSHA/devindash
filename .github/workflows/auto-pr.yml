name: Auto Create Pull Request

on:
  push:
    branches:
      - 'update/**'
      - 'feature/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pull Request via GitHub API
        run: |
          # Get the branch name
          BRANCH_NAME="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          
          # Check if PR already exists for this branch
          EXISTING_PR=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/pulls?head=$REPO:$BRANCH_NAME&state=open" | jq '.[] | select(.head.ref == "'$BRANCH_NAME'") | .number' | head -1)
          
          if [ -z "$EXISTING_PR" ]; then
            # Create PR using GitHub API
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/pulls" \
              -d '{
                "title": "Auto PR: '$BRANCH_NAME'",
                "head": "'$BRANCH_NAME'",
                "base": "'$DEFAULT_BRANCH'",
                "body": "## Automated Pull Request\n\nThis PR was automatically created from branch: `'$BRANCH_NAME'`\n\n**Changes:**\n- Review the files changed in this PR\n- Make any necessary adjustments\n- Approve and merge when ready\n\nCreated by GitHub Actions workflow"
              }'
            
            echo "✅ Pull Request created successfully!"
          else
            echo "⚠️  Pull Request already exists for this branch (PR #$EXISTING_PR)"
          fi
